<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>You are offline | Seat Outlet</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f5f5f7; color: #1d1d1f; text-align: center; }
  main { max-width: 420px; }
  h1 { font-size: 28px; line-height: 1.15; margin: 0 0 10px; letter-spacing: -.02em; }
  p { font-size: 17px; line-height: 1.5; margin: 0 0 22px; color: #424245; }
  button { min-height: 48px; padding: 0 28px; border: 0; border-radius: 980px; background: #0071e3; color: #fff; font-size: 17px; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 3px solid #0071e3; outline-offset: 3px; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f7; } p { color: #c7c7cc; } }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>Seat Outlet needs a connection to show live ticket prices and availability. Check your connection and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
