name: SFTP check

# Verifies GitHub Actions can reach the beta server over SFTP and write to the
# web root, without running a full deploy: connects to FTP_HOST on FTP_PORT
# (default 4124), uploads only test.html, reads it back over SFTP and over
# HTTPS. When DO_API_TOKEN / DO_FIREWALL_ID are set, the port is opened on the
# DigitalOcean firewall for this runner's IP only and closed again at the end,
# same as deploy.yml.
#
# Run it from the Actions tab (Run workflow). It also runs once when this
# file changes on a branch.

on:
  workflow_dispatch: {}
  push:
    branches-ignore: [main]
    paths: ['.github/workflows/sftp-check.yml']

permissions:
  contents: read

concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  check:
    name: Connect + upload test.html
    runs-on: ubuntu-latest
    environment: production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_PORT: ${{ secrets.FTP_PORT || vars.FTP_PORT || '4124' }}
      REMOTE_ROOT: /home/seatoutlet-beta/htdocs/beta.seatoutlet.com
    steps:
      - uses: actions/checkout@v4

      - name: Settings
        run: |
          echo "Runner public IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          echo "FTP_HOST set: $([ -n "$FTP_HOST" ] && echo yes || echo NO)"
          if ! [[ "$FTP_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::FTP_PORT must be a number only (e.g. 4124)"; exit 1
          fi
          echo "Port: $FTP_PORT"

      - name: Open port for this runner (DigitalOcean firewall)
        id: do_fw
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          DO_FIREWALL_ID: ${{ secrets.DO_FIREWALL_ID }}
        run: |
          if [ -z "$DO_API_TOKEN" ]; then
            echo "::notice::DO_API_TOKEN not set - not changing the DigitalOcean firewall."
            exit 0
          fi
          # List the account's cloud firewalls (IDs and rules are not secret).
          code=$(curl -sS -o fws.json -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $DO_API_TOKEN" "https://api.digitalocean.com/v2/firewalls?per_page=200")
          if [ "$code" != "200" ]; then
            echo "::error::Listing DigitalOcean firewalls failed (HTTP $code): $(cat fws.json) - check DO_API_TOKEN has the firewall:read scope."
            exit 1
          fi
          count=$(jq '.firewalls | length' fws.json)
          echo "DigitalOcean firewalls on this account: $count"
          jq -r --arg p "$FTP_PORT" '.firewalls[] |
            "- id=\(.id) name=\(.name) status=\(.status) droplets=\(.droplet_ids|length) tags=\(.tags|join(",")) port \($p) inbound from: \(
              [.inbound_rules[] | select(.protocol=="tcp" and (.ports==$p or .ports=="all" or .ports=="0")) | (.sources.addresses // []) + (.sources.tags // []) ] | flatten | join(", ") | if .=="" then "(none)" else . end)"' fws.json
          if [ -z "$DO_FIREWALL_ID" ]; then
            if [ "$count" = "1" ]; then
              DO_FIREWALL_ID=$(jq -r '.firewalls[0].id' fws.json)
              echo "::notice::DO_FIREWALL_ID not set - using the only firewall on the account ($DO_FIREWALL_ID). Save it as the DO_FIREWALL_ID secret."
            elif [ "$count" = "0" ]; then
              echo "::error::This DigitalOcean account has no cloud firewalls, so the block on port $FTP_PORT is on the server itself (not DigitalOcean) - or the server is in a different DigitalOcean account/team than this token."
              exit 1
            else
              echo "::error::Several firewalls found - set DO_FIREWALL_ID to the id (listed above) of the one attached to the server."
              exit 1
            fi
          fi
          rm -f fws.json
          echo "firewall_id=$DO_FIREWALL_ID" >> "$GITHUB_OUTPUT"
          ip=$(curl -sS --max-time 10 https://api.ipify.org)
          body=$(jq -nc --arg a "$ip/32" --arg p "$FTP_PORT" '{inbound_rules:[{protocol:"tcp",ports:$p,sources:{addresses:[$a]}}]}')
          code=$(curl -sS -o resp.json -w '%{http_code}' --max-time 20 -X POST \
            -H "Authorization: Bearer $DO_API_TOKEN" -H 'Content-Type: application/json' \
            -d "$body" "https://api.digitalocean.com/v2/firewalls/$DO_FIREWALL_ID/rules")
          if [ "$code" != "204" ]; then
            echo "::error::DigitalOcean firewall update failed (HTTP $code): $(cat resp.json)"; exit 1
          fi
          rm -f resp.json
          echo "runner_ip=$ip" >> "$GITHUB_OUTPUT"
          echo "Opened TCP $FTP_PORT for $ip/32"

      - name: TCP connection to the server
        run: |
          for attempt in 1 2 3 4 5 6; do
            if timeout 10 bash -c "exec 3<>/dev/tcp/$FTP_HOST/$FTP_PORT" 2>/dev/null; then
              echo "TCP $FTP_PORT reachable (attempt $attempt)"; exit 0
            fi
            echo "TCP $FTP_PORT not reachable yet (attempt $attempt/6)"; sleep 5
          done
          echo "::error::Cannot open TCP $FTP_PORT on FTP_HOST from GitHub Actions - a firewall is dropping this runner's IP."
          exit 1

      - name: SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 15 -p "$FTP_PORT" "$FTP_HOST" >> ~/.ssh/known_hosts
          echo "Host key types: $(awk '{print $2}' ~/.ssh/known_hosts | sort -u | tr '\n' ' ')"

      - name: Upload test.html and read it back
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -f test.html || { echo "::error::test.html is not in this commit"; exit 1; }
          url="sftp://$FTP_HOST:$FTP_PORT$REMOTE_ROOT/test.html"
          curl -sS --user "$FTP_USERNAME:$FTP_PASSWORD" -T test.html "$url"
          echo "Uploaded test.html to $REMOTE_ROOT/"
          curl -sS --user "$FTP_USERNAME:$FTP_PASSWORD" -o remote.html "$url"
          if cmp -s test.html remote.html; then
            echo "Read back over SFTP: identical ($(wc -c < remote.html) bytes)"
          else
            echo "::error::File read back over SFTP differs from test.html"; exit 1
          fi

      - name: Fetch https://beta.seatoutlet.com/test.html
        run: |
          code=$(curl -sS -o page.html -w '%{http_code}' --max-time 20 https://beta.seatoutlet.com/test.html || true)
          echo "HTTP $code"
          head -c 200 page.html 2>/dev/null; echo
          # Basic Auth or a CDN in front of the site can make this differ even
          # when the upload worked, so it is reported, not enforced.
          if [ "$code" = "200" ] && grep -q Hello page.html; then echo "Site serves test.html"; else echo "::warning::Site did not return Hello (HTTP $code)"; fi

      - name: Close port for this runner (DigitalOcean firewall)
        if: always() && steps.do_fw.outputs.runner_ip != ''
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          DO_FIREWALL_ID: ${{ steps.do_fw.outputs.firewall_id }}
          RUNNER_IP: ${{ steps.do_fw.outputs.runner_ip }}
        run: |
          body=$(jq -nc --arg a "$RUNNER_IP/32" --arg p "$FTP_PORT" '{inbound_rules:[{protocol:"tcp",ports:$p,sources:{addresses:[$a]}}]}')
          for attempt in 1 2 3; do
            code=$(curl -sS -o resp.json -w '%{http_code}' --max-time 20 -X DELETE \
              -H "Authorization: Bearer $DO_API_TOKEN" -H 'Content-Type: application/json' \
              -d "$body" "https://api.digitalocean.com/v2/firewalls/$DO_FIREWALL_ID/rules")
            [ "$code" = "204" ] && { echo "Removed rule for $RUNNER_IP/32"; exit 0; }
            echo "Attempt $attempt: HTTP $code $(cat resp.json)"; sleep 5
          done
          echo "::error::Could not remove the firewall rule for $RUNNER_IP/32 - remove it manually in DigitalOcean."
          exit 1
