name: Seatics DOM probe (temporary)

# One-off: opens the Seatics MapWidget3 Filter & Sort drawer for a sandbox
# event and prints its markup and the widget's own CSS rules for it, so the
# drawer can be restyled against the real DOM. Delete after use.

on:
  push:
    branches-ignore: [main]
    paths: ['.github/workflows/seatics-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Open the filter drawer and dump it
        run: |
          npm i --no-save --silent playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > probe.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const src = 'https://mapwidget3.seatics.com/js?eventId=203518&websiteConfigId=12498&mobileOptimized=true&includeJQuery=true&containerId=tn-maps&useDarkTheme=false';
            await page.route('https://beta.seatoutlet.com/probe.html', r => r.fulfill({ contentType: 'text/html',
              body: `<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><div id="tn-maps" class="seatics" style="height:calc(100vh - 50px);width:100%"></div><script src="${src}"></script></body></html>` }));
            await page.goto('https://beta.seatoutlet.com/probe.html');
            await page.waitForTimeout(15000);
            const btn = await page.$('#sea-inventory-filtersBtncnt, [id*="filtersBtn"], [class*="filter-btn"]');
            console.log('filter button found:', !!btn);
            if (btn) { await btn.click(); await page.waitForTimeout(2500); }
            const out = await page.evaluate(() => {
              const el = document.querySelector('#sea-filterCard-parent') || document.querySelector('[id*="filterCard"]');
              if (!el) return { html: null, ids: [...document.querySelectorAll('[id]')].map(e => e.id).filter(i => /filter|sort|qty/i.test(i)).slice(0, 80) };
              const c = el.cloneNode(true);
              c.querySelectorAll('svg, script, style, img').forEach(n => n.replaceWith(document.createComment(n.tagName)));
              const r = el.getBoundingClientRect();
              return { html: c.outerHTML.replace(/\s+/g, ' '), rect: [r.x, r.y, r.width, r.height].map(Math.round), visible: getComputedStyle(el).display,
                sheets: [...document.styleSheets].map(s => s.href).filter(Boolean) };
            });
            console.log('===== DRAWER =====');
            console.log(JSON.stringify(out, null, 1));
            const keys = /filterCard|\.switch|\.slider|qty-filter|sort-|dropdown|filters-|price-filter|sea-filter|toggle-cnt|ada/i;
            for (const href of (out.sheets || [])) {
              try {
                const css = await (await fetch(href)).text();
                const blocks = css.replace(/\/\*[\s\S]*?\*\//g, '').split('}').map(b => b.trim()).filter(b => b.includes('{') && keys.test(b.split('{')[0]));
                console.log(`===== CSS ${href} (${blocks.length} rules) =====`);
                console.log(blocks.map(b => b + '}').join('\n').slice(0, 60000));
              } catch (e) { console.log('fetch failed', href, e.message); }
            }
            await browser.close();
          })();
          EOF
          node probe.js
