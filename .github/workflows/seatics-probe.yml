name: Seatics DOM probe (temporary)

# One-off: opens the Parking Passes tab of the Seatics MapWidget3 ticket list
# and prints the tab bar, the first parking rows, what sits on top of the tab,
# and the widget's own CSS for the list, so the event page can restyle it.
# Delete after use.

on:
  push:
    branches-ignore: [main]
    paths: ['.github/workflows/seatics-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump the parking list
        run: |
          npm i --no-save --silent playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > probe.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const sheets = new Set();
            for (const [label, w, h, mobile] of [['desktop', 1440, 900, false], ['phone', 390, 844, true]]) {
              const page = await browser.newPage({ viewport: { width: w, height: h }, isMobile: mobile, hasTouch: mobile });
              const src = 'https://mapwidget3.seatics.com/js?eventId=203518&websiteConfigId=12498&mobileOptimized=true&includeJQuery=true&containerId=tn-maps&useDarkTheme=false';
              await page.route('https://beta.seatoutlet.com/probe.html', r => r.fulfill({ contentType: 'text/html',
                body: `<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><div id="tn-maps" class="seatics" style="height:calc(100vh - 50px);width:100%"></div><script src="${src}"></script></body></html>` }));
              await page.goto('https://beta.seatoutlet.com/probe.html');
              await page.waitForTimeout(15000);
              (await page.evaluate(() => [...document.styleSheets].map(s => s.href).filter(Boolean))).forEach(x => sheets.add(x));
              const strip = `el => { if (!el) return null; const c = el.cloneNode(true); c.querySelectorAll('svg, script, style, img').forEach(n => n.replaceWith(document.createComment(n.tagName))); return c.outerHTML.replace(/\\s+/g, ' '); }`;
              const tabInfo = await page.evaluate(() => {
                const tabs = [...document.querySelectorAll('#tn-maps label, #tn-maps button, #tn-maps [role="tab"], #tn-maps [role="radio"]')].filter(e => /parking/i.test(e.textContent));
                return tabs.map(t => { const r = t.getBoundingClientRect(); const top = document.elementFromPoint(r.x + r.width / 2, r.y + r.height / 2);
                  return { tag: t.tagName, id: t.id, cls: t.className, text: t.textContent.trim().slice(0, 40), rect: [r.x, r.y, r.width, r.height].map(Math.round), visible: t.offsetParent !== null,
                    topElement: top ? `${top.tagName}#${top.id}.${String(top.className).trim().replace(/\s+/g, '.')}` : null, topIsTab: !!top && (top === t || t.contains(top)), pointerEvents: getComputedStyle(t).pointerEvents }; });
              });
              console.log(`===== ${label} parking tabs =====`); console.log(JSON.stringify(tabInfo, null, 1));
              const bar = await page.evaluate(`(${strip})(document.querySelector('#sea-inventory-slider-with-filterBtn') || document.querySelector('[id*="inventory-slider"]'))`);
              console.log(`===== ${label} tab bar =====`); console.log((bar || 'null').slice(0, 8000));
              // click the parking tab (force, in case it is covered) and dump the list
              const handle = await page.evaluateHandle(() => [...document.querySelectorAll('#tn-maps label, #tn-maps button, #tn-maps [role="tab"], #tn-maps [role="radio"]')].find(e => /parking/i.test(e.textContent) && e.offsetParent !== null));
              const el = handle.asElement();
              if (el) { try { await el.click({ timeout: 3000 }); console.log('normal click ok'); } catch (e) { console.log('normal click failed:', e.message.split('\n')[0]); await el.click({ force: true }); console.log('forced click'); } }
              await page.waitForTimeout(3000);
              const list = await page.evaluate(`(() => { const s = ${strip}; const tc = document.querySelector('#ticketsContainer') || document.querySelector('#list-ctn');
                const rows = tc ? [...tc.querySelectorAll('[class*="venue-ticket-list-row"], .sea-ticket-row, [class*="tg-row"]')].slice(0, 2) : [];
                const banner = [...document.querySelectorAll('#tn-maps *')].find(e => /not valid for entry/i.test(e.textContent) && e.children.length < 3);
                return { container: tc ? tc.id + '.' + tc.className : null, banner: s(banner), rows: rows.map(s), listHead: tc ? s(tc).slice(0, 5000) : null }; })()`);
              console.log(`===== ${label} parking list =====`); console.log(JSON.stringify(list, null, 1).slice(0, 20000));
              await page.close();
            }
            const keys = /venue-ticket-list|ticket-type|inventory-slider|sea-inventory|tl-|ticket-list|tickets-table|list-ctn|parking|sea-tg|tg-|slick|checkbox|mylist|my-list/i;
            for (const href of sheets) {
              const css = (await (await fetch(href)).text()).replace(/\/\*[\s\S]*?\*\//g, '');
              const rules = []; const re = /(@media[^{]+)\{((?:[^{}]*\{[^{}]*\})*)\s*\}|([^{}@]+)\{([^{}]*)\}/g; let m;
              while ((m = re.exec(css))) {
                if (m[1]) { const hit = (m[2].match(/[^{}]+\{[^{}]*\}/g) || []).filter(r => keys.test(r.split('{')[0])); if (hit.length) rules.push(m[1].trim() + ' { ' + hit.join(' ') + ' }'); }
                else if (keys.test(m[3])) rules.push(m[3].trim() + '{' + m[4] + '}');
              }
              console.log(`===== CSS ${href} (${rules.length}) =====`); console.log(rules.join('\n').slice(0, 45000));
            }
            await browser.close();
          })();
          JS
          node probe.js
