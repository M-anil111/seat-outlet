name: Seatics DOM probe (temporary)

# One-off: lists every rule in the Seatics MapWidget3 stylesheets that uses
# the widget's default accent colors, plus the pre-checkout markup, so the
# event page can override them all. Delete after use.

on:
  push:
    branches-ignore: [main]
    paths: ['.github/workflows/seatics-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Collect accent-color rules and pre-checkout markup
        run: |
          npm i --no-save --silent playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > probe.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const sheets = new Set();
            for (const [label, w, h, mobile] of [['phone', 390, 844, true], ['desktop', 1440, 900, false]]) {
              const page = await browser.newPage({ viewport: { width: w, height: h }, isMobile: mobile, hasTouch: mobile });
              const src = 'https://mapwidget3.seatics.com/js?eventId=203518&websiteConfigId=12498&mobileOptimized=true&includeJQuery=true&containerId=tn-maps&useDarkTheme=false';
              await page.route('https://beta.seatoutlet.com/probe.html', r => r.fulfill({ contentType: 'text/html',
                body: `<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><div id="tn-maps" class="seatics" style="height:calc(100vh - 50px);width:100%"></div><script src="${src}"></script></body></html>` }));
              await page.goto('https://beta.seatoutlet.com/probe.html');
              await page.waitForTimeout(15000);
              (await page.evaluate(() => [...document.styleSheets].map(s => s.href).filter(Boolean))).forEach(h => sheets.add(h));
              // open the first ticket group to reach the pre-checkout screen
              const row = await page.$('#ticketsContainer [class*="venue-ticket-list-row"], #content-area > div, .sea-ticket-row, [class*="ticket-group"]');
              console.log(label, 'ticket row found:', !!row);
              if (row) { try { await row.click(); await page.waitForTimeout(3000); } catch (e) { console.log('click failed', e.message); } }
              const out = await page.evaluate(() => {
                const el = document.querySelector('#sea-precheckout-parent, .pre-checkout-parent, [id*="precheckout"]');
                if (!el) return null;
                const c = el.cloneNode(true); c.querySelectorAll('svg, script, style, img').forEach(n => n.replaceWith(document.createComment(n.tagName)));
                const green = [...document.querySelectorAll('#tn-maps *')].filter(e => { const s = getComputedStyle(e); return [s.backgroundColor, s.color, s.borderTopColor].some(v => /rgb\(41, 193, 66\)|rgb\(255, 85, 102\)|rgb\(0, 138, 23\)/.test(v)) && e.offsetParent !== null; })
                  .map(e => `${e.tagName.toLowerCase()}#${e.id}.${String(e.className).trim().replace(/\s+/g, '.')} bg=${getComputedStyle(e).backgroundColor} color=${getComputedStyle(e).color}`).slice(0, 40);
                return { precheckout: c.outerHTML.replace(/\s+/g, ' ').slice(0, 8000), visibleAccentElements: green };
              });
              console.log(`===== ${label} =====`); console.log(JSON.stringify(out, null, 1));
              await page.close();
            }
            const accents = /#29c142|#ff5566|#008a17|#f56|#e5385a|#d63a4c|#28a745|#27ae60|#4cd964|#fd5c63|#ea4335|rgba?\(41,\s?193,\s?66/i;
            for (const href of sheets) {
              const css = (await (await fetch(href)).text()).replace(/\/\*[\s\S]*?\*\//g, '');
              const rules = [];
              const re = /(@media[^{]+)\{((?:[^{}]*\{[^{}]*\})*)\s*\}|([^{}@]+)\{([^{}]*)\}/g; let m;
              while ((m = re.exec(css))) {
                if (m[1]) { (m[2].match(/[^{}]+\{[^{}]*\}/g) || []).filter(r => accents.test(r)).forEach(r => rules.push(m[1].trim() + ' >> ' + r.trim())); }
                else if (accents.test(m[4])) rules.push(m[3].trim() + '{' + m[4] + '}');
              }
              console.log(`===== CSS ${href} (${rules.length} accent rules) =====`);
              console.log(rules.join('\n').slice(0, 60000));
            }
            await browser.close();
          })();
          JS
          node probe.js
