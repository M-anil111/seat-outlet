name: Seatics DOM probe (temporary)

# One-off: prints the Seatics MapWidget3 event header markup at phone and
# iPad widths, plus the widget's own CSS rules for it, so the event page
# can keep the date visible there. Delete after use.

on:
  push:
    branches-ignore: [main]
    paths: ['.github/workflows/seatics-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump the event header
        run: |
          npm i --no-save --silent playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > probe.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            let sheets = [];
            for (const [label, w, h] of [['phone', 390, 844], ['ipad', 820, 1180], ['desktop', 1440, 900]]) {
              const page = await browser.newPage({ viewport: { width: w, height: h }, isMobile: label !== 'desktop', hasTouch: label !== 'desktop' });
              const src = 'https://mapwidget3.seatics.com/js?eventId=203518&websiteConfigId=12498&mobileOptimized=true&includeJQuery=true&containerId=tn-maps&useDarkTheme=false';
              await page.route('https://beta.seatoutlet.com/probe.html', r => r.fulfill({ contentType: 'text/html',
                body: `<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><div id="tn-maps" class="seatics" style="height:calc(100vh - 50px);width:100%"></div><script src="${src}"></script></body></html>` }));
              await page.goto('https://beta.seatoutlet.com/probe.html');
              await page.waitForTimeout(15000);
              const out = await page.evaluate(() => {
                const el = document.querySelector('.event-info-ctn') || document.querySelector('#event-info-area');
                if (!el) return { html: null };
                const c = el.cloneNode(true);
                c.querySelectorAll('svg, script, style, img').forEach(n => n.replaceWith(document.createComment(n.tagName)));
                const vis = [...el.querySelectorAll('*')].filter(e => e.children.length === 0 && e.textContent.trim() && e.offsetParent !== null)
                  .map(e => `${e.tagName.toLowerCase()}.${String(e.className).replace(/\s+/g, '.')} "${e.textContent.trim().slice(0, 60)}"`);
                return { html: c.outerHTML.replace(/\s+/g, ' ').slice(0, 12000), visibleText: vis, sheets: [...document.styleSheets].map(s => s.href).filter(Boolean) };
              });
              console.log(`===== ${label} ${w}x${h} =====`);
              console.log(JSON.stringify(out, null, 1));
              sheets = sheets.concat(out.sheets || []);
              await page.close();
            }
            const keys = /event-info/i;
            for (const href of [...new Set(sheets)]) {
              try {
                const css = await (await fetch(href)).text();
                const parts = css.replace(/\/\*[\s\S]*?\*\//g, '');
                // keep @media wrappers: print each matching rule with its enclosing media query
                const re = /(@media[^{]+)\{((?:[^{}]*\{[^{}]*\})*)\s*\}|([^{}@]+)\{([^{}]*)\}/g;
                const out = []; let m;
                while ((m = re.exec(parts))) {
                  if (m[1]) { const inner = m[2].match(/[^{}]+\{[^{}]*\}/g) || []; const hit = inner.filter(r => keys.test(r.split('{')[0])); if (hit.length) out.push(m[1].trim() + ' { ' + hit.join(' ') + ' }'); }
                  else if (keys.test(m[3])) out.push(m[3].trim() + '{' + m[4] + '}');
                }
                console.log(`===== CSS ${href} (${out.length}) =====`);
                console.log(out.join('\n').slice(0, 40000));
              } catch (e) { console.log('fetch failed', href, e.message); }
            }
            await browser.close();
          })();
          EOF
          node probe.js
