name: CI

# Runs on every pull request and every push to a non-main branch, so
# problems are caught before merge - not after, at deploy time. (Deploy
# itself still lints and validates composer.lock as a final gate right
# before going to beta - see .github/workflows/deploy.yml - a little
# overlap between the two is fine; this one is the one that actually
# blocks a PR.)

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  lint-and-static-checks:
    name: Lint + static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, curl, mbstring, json
          coverage: none

      - name: Lint every PHP file
        run: |
          status=0
          while IFS= read -r -d '' f; do
            php -l "$f" || status=1
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './phpmailer/*' -print0)
          exit $status

      - name: Check for fewer-args-than-required function calls
        run: php tools/check-arg-counts.php .

      - name: Check for calls to undefined functions
        run: php tools/check-undefined-functions.php .

      - name: SEO titles and descriptions follow the site rules
        run: php tools/check-seo-titles.php

      - name: Event titles stay unique per showing (long names keep the day, same-day showings add the time)
        run: php tools/test-event-titles.php

      - name: Category links go straight to the genre page (no 301 link on every page)
        run: php tools/test-category-links.php

      - name: Page type stylesheets and critical CSS are in place and under the size limits
        run: php tools/check-css-groups.php

      - name: Holiday dates (Easter, Thanksgiving, long weekends) are right for 2026 to 2028
        run: php tools/test-holidays.php

      - name: County helpers (Census response parsing, city filter) behave
        run: php tools/test-counties.php
      - name: Pixabay city photo source (tag matching, attribution, licence)
        run: php tools/test-pixabay.php
      - name: Unsplash city photo source (relevance filter, attribution, hotlink rules)
        run: php tools/test-unsplash.php
      - name: JSON-LD output cannot be broken out of by visitor text (search query XSS)
        run: php tools/test-jsonld-safe.php
      - name: Pagination links on the A to Z directories are not redirected away
        run: php tools/test-page-param.php
      - name: Contact form same-origin check (live host differs from the public host)
        run: php tools/test-contact-origin.php
      - name: Location lookup never invents a city; no location shows nationwide events
        run: php tools/test-location-fallback.php
      - name: Pages keep rendering when the ticket feed is down (no empty 503 page)
        run: php tools/test-feed-down.php
      - name: TicketNetwork call budget, single-flight, Retry-After and breaker families
        run: php tools/test-tn-budget.php
      - name: TicketNetwork bulk importer helpers (parameters, event mapping, run choice, delete safety)
        run: php tools/test-tn-bulk.php
      - name: TicketNetwork listing copies, stale windows, empty-answer guard and query guard
        run: php tools/test-tn-listing-copy.php
      - name: TicketNetwork event snapshot (migration 0048) and its fallback order
        run: php tools/test-tn-snapshot.php
      - name: Listing filter allowlist accepts every filter shape the site builds
        run: php tools/test-listing-filter.php
      - name: Every date, price and sort option builds a valid listing request
        run: php tools/test-listing-options.php
      - name: Dead performer links
        run: php tools/test-dead-performers.php
      - name: Wrong-city venue facts and page numbers in titles
        run: |
          php tools/test-entity-facts-pick.php
          php tools/test-page-tag.php
          php tools/test-event-promo-meta.php
          php tools/test-promo-claims.php
          php tools/test-order-verify.php
          php tools/test-newsletter-consolidation.php
          php tools/test-dir-sort.php
          php tools/test-photo-credits-link.php
          php tools/check-csp.php
          php tools/test-fee-claims.php
          php tools/test-launch-checklist.php
          php tools/test-csp-summary.php
          php tools/test-blog-links.php
      - name: Reliability docs state the same windows and limits as the code
        run: php tools/check-docs-constants.php
      - name: Event offer schema and social profiles
        run: php tools/test-event-offer.php
      - name: PHP security release table (offline)
        run: php tools/test-php-patch.php
      - name: Event page never says tickets are unavailable when the feed lists them
        run: php tools/test-widget-mismatch.php
      - name: Popular and nationwide lists read in date order
        run: php tools/test-feed-order.php
      - name: Crawl guard
        run: php tools/test-ratelimit.php
      - name: Old address forms still resolve
        run: php tools/test-slug-legacy.php
      - name: Worker helpers (blocked paths, clean paths, rewrites)
        run: node tools/test-worker.mjs

      - name: The sitemap's automatic page list finds every page and only pages
        run: php tools/check-sitemap-pages.php

      - name: No ticket API id in any URL (slugs come from soSlug only)
        run: php tools/check-url-slugs.php

      - name: No function is defined twice
        run: |
          # Two top-level functions with the same name only fail at runtime, on the pages that load both files.
          dupes=$(grep -rhoP '^\s*function\s+\K\w+(?=\s*\()' --include=*.php --exclude-dir=vendor --exclude-dir=phpmailer --exclude-dir=node_modules . | sort | uniq -d)
          if [ -n "$dupes" ]; then echo "::error::Functions defined more than once: $dupes"; exit 1; fi

      - name: Icon subset covers every bi-* class used
        run: python3 tools/build-icons.py --check

      - name: Minified CSS/JS are up to date
        run: |
          # css/style.min.css and js/*.min.js are built from the readable sources
          # (tools/build-assets.sh) and committed; fail when someone edited a source
          # without rebuilding, so production never serves stale assets.
          tools/build-assets.sh --check

      - name: Validate composer.lock is in sync
        run: |
          composer validate --no-check-publish --no-check-all
          composer install --no-interaction --no-progress --prefer-dist --dry-run

      - name: composer audit (dependency vulnerabilities)
        run: composer audit --no-interaction || (echo "::error::composer audit found a vulnerability advisory - see output above" && exit 1)

  migrations:
    # Production runs MariaDB, so every database step below also runs against a MariaDB image. The MySQL job keeps its original name, which
    # is the check name branch protection may require; the MariaDB job adds its own name. Both start from an empty database.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Database migrations apply cleanly
            image: mysql:8.0
            ping: mysqladmin ping -pci_root_password
          - name: Database migrations apply cleanly (MariaDB 10.11)
            image: mariadb:10.11
            ping: mariadb-admin ping -pci_root_password
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          # db/config.php deliberately treats an empty DB_PASS as "not set"
          # and refuses to connect (see the same check in the real app) -
          # so this needs a real password, not MYSQL_ALLOW_EMPTY_PASSWORD.
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: seatoutlet_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.ping }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: seatoutlet_ci
      DB_USER: root
      DB_PASS: ci_root_password
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli

      - name: Show the database server version
        run: php -r 'mysqli_report(MYSQLI_REPORT_OFF); $m = new mysqli(getenv("DB_HOST"), getenv("DB_USER"), getenv("DB_PASS"), getenv("DB_NAME"), (int) getenv("DB_PORT")); echo $m->server_info, "\n";'

      - name: Apply migrations against a fresh database
        run: php db/migrate.php

      - name: Apply again (must be a no-op - proves idempotency)
        run: php db/migrate.php

      - name: URL slug registry (clean slugs, collisions, old form still resolves)
        run: php tools/test-slugs.php
      - name: Database reconnect (soDbRetry)
        run: php tools/test-db-retry.php
      - name: Verified orders (record once, claim the purchase once)
        run: php tools/test-order-verify-db.php
      - name: Email sign-ups (new, repeat, same answer to the visitor)
        run: php tools/test-leads-db.php
      - name: Bulk catalog read side and zero-event pages
        run: |
          php tools/test-tn-bulk-read.php
          php tools/test-zero-pages.php
      - name: Removed-event redirects (performer, category, bulk fallback, unknown stays 404)
        run: php tools/test-event-redirects-db.php

      - name: Apply the sample seed (must also be safe to run twice)
        run: |
          php db/migrate.php --seed=page_rules_sample
          php db/migrate.php --seed=page_rules_sample

  csp-browser:
    # The policy is report-only, so nothing breaks when it is wrong. This opens the site's own pages in Chromium, reads the browser's
    # securitypolicyviolation events and fails on any that tools/csp-known-violations.json does not list (docs/csp.md).
    name: CSP in a real browser
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: seatoutlet_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -pci_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: seatoutlet_ci
      DB_USER: root
      DB_PASS: ci_root_password
      # Placeholders: the pages checked need no TicketNetwork, mail or reCAPTCHA call to succeed. HOME_URL is the origin the check opens,
      # because the site writes absolute asset addresses from it and 'self' must match.
      HOME_URL: http://127.0.0.1:8161
      CONSUMER_KEY: ci-placeholder
      CONSUMER_SECRET: ci-placeholder
      GAPI_KEY: ci-placeholder
      AWS_ACCESS_KEY: ci-placeholder
      AWS_SECRET_KEY: ci-placeholder
      RECAPTCHA_SECRET_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, curl, mbstring, json, gd

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create the database tables
        run: php db/migrate.php

      - name: Install Chromium for the check
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Start the site
        run: |
          # A router so clean addresses (/privacy-policy) reach their script, like the web server's rewrite rules.
          cat > /tmp/csp-router.php <<'ROUTER'
          <?php
          $p = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH);
          $root = getenv('GITHUB_WORKSPACE');
          chdir($root);
          if ($p === '/') { require $root . '/index.php'; return true; }
          if (is_file($root . $p) && !preg_match('/\.php$/', $p)) return false;
          $f = $root . rtrim($p, '/') . '.php';
          if (is_file($f)) { $_SERVER['SCRIPT_NAME'] = rtrim($p, '/') . '.php'; require $f; return true; }
          return false;
          ROUTER
          nohup php -S 127.0.0.1:8161 -t "$GITHUB_WORKSPACE" /tmp/csp-router.php > /tmp/csp-site.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8161/privacy-policy && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8161/privacy-policy

      - name: Open the pages and read the violations
        run: node tools/test-csp-browser.mjs http://127.0.0.1:8161

      - name: Event page seat-map wiring (precheckout modes, begin_checkout once, no broken state)
        run: node tools/test-event-widget.mjs

      - name: Site log (on failure)
        if: failure()
        run: tail -n 60 /tmp/csp-site.log

