name: Build & Deploy

# Replaces bitbucket-pipelines.yml now that this repo lives on GitHub.
# Same two-stage shape as before (lint/build check, then deploy), same FTP
# upload technique (proven necessary - see the comments below, carried over
# from the Bitbucket pipeline), and the same secret names, just moved from
# "Repository variables" (Bitbucket) to "Repository secrets" (GitHub:
# Settings -> Secrets and variables -> Actions).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build and check PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, curl, mbstring, json

      - name: PHP version
        run: php -v

      - name: Lint all PHP files
        run: |
          status=0
          while IFS= read -r -d '' f; do
            php -l "$f" || status=1
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './phpmailer/*' -print0)
          exit $status

      - name: Validate composer.lock is in sync
        run: |
          composer validate --no-check-publish --no-check-all
          composer install --no-interaction --no-progress --prefer-dist --dry-run

  deploy:
    name: Deploy to Demo
    needs: build
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time: each run adds and later removes its own runner IP
    # on the DigitalOcean firewall, and overlapping uploads would interleave.
    concurrency:
      group: deploy-beta
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # SFTP (TCP 4124) is closed to the internet by a DigitalOcean cloud
      # firewall. GitHub-hosted runners have no fixed IP, so each run opens
      # 4124 for its own public IP only, and the always() step at the end of
      # this job removes that rule again - even when the deploy fails or is
      # cancelled. Needs DO_API_TOKEN (scopes: firewall:read, firewall:update)
      # and DO_FIREWALL_ID; skipped when they are unset.
      - name: Open SFTP port for this runner (DigitalOcean firewall)
        id: do_fw
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          DO_FIREWALL_ID: ${{ secrets.DO_FIREWALL_ID }}
        run: |
          if [ -z "$DO_API_TOKEN" ] || [ -z "$DO_FIREWALL_ID" ]; then
            echo "::notice::DO_API_TOKEN / DO_FIREWALL_ID not set - not changing the DigitalOcean firewall."
            exit 0
          fi
          ip=$(curl -sS --max-time 10 https://api.ipify.org)
          if ! [[ "$ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not determine this runner's public IPv4 address (got: '$ip')"
            exit 1
          fi
          body=$(jq -nc --arg a "$ip/32" '{inbound_rules:[{protocol:"tcp",ports:"4124",sources:{addresses:[$a]}}]}')
          code=$(curl -sS -o resp.json -w '%{http_code}' --max-time 20 -X POST \
            -H "Authorization: Bearer $DO_API_TOKEN" -H 'Content-Type: application/json' \
            -d "$body" "https://api.digitalocean.com/v2/firewalls/$DO_FIREWALL_ID/rules")
          if [ "$code" != "204" ]; then
            echo "::error::DigitalOcean firewall update failed (HTTP $code): $(cat resp.json)"
            exit 1
          fi
          rm -f resp.json
          echo "runner_ip=$ip" >> "$GITHUB_OUTPUT"
          echo "Opened TCP 4124 on the DigitalOcean firewall for $ip/32"

      - name: Trust the server's SSH host key
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          echo "This runner's public IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          # A freshly added DigitalOcean firewall rule can take a few seconds
          # to apply, so retry for up to ~60s before giving up.
          reachable=0
          for attempt in 1 2 3 4 5 6; do
            if timeout 10 bash -c "exec 3<>/dev/tcp/$FTP_HOST/4124" 2>/dev/null; then
              reachable=1; break
            fi
            echo "TCP 4124 not reachable yet (attempt $attempt/6)"
            sleep 5
          done
          if [ "$reachable" -ne 1 ]; then
            echo "::error::Cannot open TCP port 4124 on FTP_HOST from GitHub Actions. The server (or its cloud provider firewall) is dropping connections from GitHub's IP ranges - allow inbound TCP 4124 from them. Also check FTP_HOST is a bare hostname/IP (no sftp://, port or trailing slash)."
            exit 1
          fi
          mkdir -p ~/.ssh
          ssh-keyscan -T 15 -p 4124 "$FTP_HOST" >> ~/.ssh/known_hosts
          echo "Known hosts populated:"
          cat ~/.ssh/known_hosts

      - name: Generate inc/env.local.php from GitHub Secrets
        run: |
          php -r '
          $vars = [
              "DB_PASS", "CONSUMER_KEY", "CONSUMER_SECRET", "GAPI_KEY", "GKGSAPI_KEY",
              "AWS_ACCESS_KEY", "AWS_SECRET_KEY", "RECAPTCHA_SECRET_KEY", "SMTP_USER", "SMTP_PASS",
              "SENTRY_DSN", "SENTRY_ENVIRONMENT",
              "THESPORTSDB_KEY", "PEXELS_API_KEY", "MAXMIND_ACCOUNT_ID", "MAXMIND_LICENSE_KEY", "GEOIP_DB_PATH", "TN_CHECKOUT_URL", "GTM_ID",
          ];
          // Optional: Sentry, the image-source keys, the Knowledge Graph key
          // (no longer used for images; kept so an existing secret still flows through),
          // and Brevo SMTP (newsletter and admin password-reset emails are skipped
          // when unset; newsletter signups are still saved to the database).
          $optional = ["SMTP_USER", "SMTP_PASS", "SENTRY_DSN", "SENTRY_ENVIRONMENT", "THESPORTSDB_KEY", "PEXELS_API_KEY", "GKGSAPI_KEY", "MAXMIND_ACCOUNT_ID", "MAXMIND_LICENSE_KEY", "GEOIP_DB_PATH", "TN_CHECKOUT_URL", "GTM_ID"];
          $lines = ["<?php"];
          foreach ($vars as $v) {
              $val = getenv($v);
              if ($val === false || $val === "") {
                  if (in_array($v, $optional, true)) {
                      continue;
                  }
                  fwrite(STDERR, "Missing required repository secret: $v\n");
                  exit(1);
              }
              $lines[] = "putenv(" . var_export($v . "=" . $val, true) . ");";
          }
          file_put_contents("inc/env.local.php", implode("\n", $lines) . "\n");
          echo "Generated inc/env.local.php with " . (count($lines) - 1) . " variables\n";
          '
        env:
          DB_PASS: ${{ secrets.DB_PASS }}
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
          GAPI_KEY: ${{ secrets.GAPI_KEY }}
          GKGSAPI_KEY: ${{ secrets.GKGSAPI_KEY }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ secrets.SENTRY_ENVIRONMENT }}
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
          GEOIP_DB_PATH: ${{ vars.GEOIP_DB_PATH }}
          TN_CHECKOUT_URL: ${{ vars.TN_CHECKOUT_URL }}
          GTM_ID: ${{ vars.GTM_ID }}

      # Upload the whole tree over SFTP with plain curl, one file at a time -
      # git-ftp's bundled curl/libssh2 attempts SSH public-key auth first and
      # fails outright instead of falling back to the supplied password;
      # lftp's "-u user,pass" syntax also breaks if the password contains a
      # comma. curl's --user user:pass splits only on the first colon and
      # takes the rest verbatim, so it's safe for any password. (Carried over
      # unchanged from the Bitbucket pipeline - this constraint is about the
      # tools, not the CI provider.)
      - name: Upload over SFTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          REMOTE_ROOT="/home/seatoutlet-beta/htdocs/beta.seatoutlet.com"
          find . -type f -not -path './.git/*' -print0 | \
            xargs -0 -P 4 -I{} bash -c '
              f="{}"
              rel="${f#./}"
              curl -sS --ftp-create-dirs --user "$0:$1" -T "$f" "sftp://$2:4124/$3/$rel" \
                || echo "FAILED: $rel"
            ' "$FTP_USERNAME" "$FTP_PASSWORD" "$FTP_HOST" "$REMOTE_ROOT"
          echo "Upload pass complete"
          FAIL_COUNT=$(find . -type f -not -path './.git/*' -print0 | \
            xargs -0 -P 4 -I{} bash -c '
              f="{}"; rel="${f#./}"
              curl -sS --user "$0:$1" -o /dev/null "sftp://$2:4124/$3/$rel" || echo x
            ' "$FTP_USERNAME" "$FTP_PASSWORD" "$FTP_HOST" "$REMOTE_ROOT" | wc -l)
          echo "Post-upload verification: $FAIL_COUNT file(s) not confirmed on server"
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "Deploy verification failed - not all files reached the server"
            exit 1
          fi

      - name: Close SFTP port for this runner (DigitalOcean firewall)
        if: always() && steps.do_fw.outputs.runner_ip != ''
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          DO_FIREWALL_ID: ${{ secrets.DO_FIREWALL_ID }}
          RUNNER_IP: ${{ steps.do_fw.outputs.runner_ip }}
        run: |
          body=$(jq -nc --arg a "$RUNNER_IP/32" '{inbound_rules:[{protocol:"tcp",ports:"4124",sources:{addresses:[$a]}}]}')
          for attempt in 1 2 3; do
            code=$(curl -sS -o resp.json -w '%{http_code}' --max-time 20 -X DELETE \
              -H "Authorization: Bearer $DO_API_TOKEN" -H 'Content-Type: application/json' \
              -d "$body" "https://api.digitalocean.com/v2/firewalls/$DO_FIREWALL_ID/rules")
            if [ "$code" = "204" ]; then
              echo "Removed TCP 4124 rule for $RUNNER_IP/32"; exit 0
            fi
            echo "Attempt $attempt: HTTP $code $(cat resp.json)"
            sleep 5
          done
          echo "::error::Could not remove the firewall rule for $RUNNER_IP/32 - remove it manually in DigitalOcean (Networking -> Firewalls)."
          exit 1
