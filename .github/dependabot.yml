# Workflow actions are pinned to commit SHAs (tools/test-actions-pinned.php). Dependabot opens a pull request when a pinned action
# has a new release, so the pins do not go stale. It only proposes; nothing merges without review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
