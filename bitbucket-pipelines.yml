image: php:8.1

pipelines:
  branches:
    main:
      - step:
          name: Build and check PHP version
          size: 4x
          runtime:
            cloud:
              atlassian-ip-ranges: true
          script:
            - php -v

      - step:
          name: Deploy To Demo
          size: 4x
          runtime:
            cloud:
              atlassian-ip-ranges: true
          deployment: production
          script:
            - apt-get update
            - apt-get install -y lftp curl
            - |
                echo "Public IP of this pipeline is:"
                curl -s ifconfig.me

            # Generate inc/env.local.php from secured repository variables. This file
            # is never committed to git - it's created fresh in the build workspace on
            # every deploy and uploaded to the server in the same pass as the rest of
            # the tree below.
            - |
                php -r '
                $vars = ["DB_PASS","CONSUMER_KEY","CONSUMER_SECRET","GAPI_KEY","GKGSAPI_KEY","AWS_ACCESS_KEY","AWS_SECRET_KEY","RECAPTCHA_SECRET_KEY","SMTP_USER","SMTP_PASS"];
                $lines = ["<?php"];
                foreach ($vars as $v) {
                    $val = getenv($v);
                    if ($val === false || $val === "") {
                        fwrite(STDERR, "Missing required pipeline variable: $v\n");
                        exit(1);
                    }
                    $lines[] = "putenv(" . var_export($v . "=" . $val, true) . ");";
                }
                file_put_contents("inc/env.local.php", implode("\n", $lines) . "\n");
                echo "Generated inc/env.local.php with " . count($vars) . " variables\n";
                '

            # Upload the whole tree over SFTP via lftp rather than git-ftp - git-ftp's
            # bundled curl/libssh2 in this image attempts SSH public-key auth first
            # and fails outright instead of falling back to the supplied password.
            - |
                lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p 4124 sftp://$FTP_HOST -e "
                set sftp:auto-confirm yes;
                set net:max-retries 3;
                set net:timeout 30;
                mirror -R --parallel=4 ./ /home/seatoutlet-beta/htdocs/beta.seatoutlet.com/;
                bye
                "
