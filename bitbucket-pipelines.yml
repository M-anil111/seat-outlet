image: php:8.1

pipelines:
  branches:
    main:
      - step:
          name: Build and check PHP version
          size: 4x
          runtime:
            cloud:
              atlassian-ip-ranges: true
          script:
            - php -v

      - step:
          name: Deploy To Demo
          size: 4x
          runtime:
            cloud:
              atlassian-ip-ranges: true
          deployment: production
          script:
            - apt-get update
            - apt-get install -y curl openssh-client
            - |
                echo "Public IP of this pipeline is:"
                curl -s ifconfig.me

            # Trust the server's real SSH host key so curl's SFTP connections can
            # verify it properly, instead of skipping verification entirely.
            - |
                mkdir -p ~/.ssh
                ssh-keyscan -p 4124 "$FTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null
                echo "Known hosts populated:"
                cat ~/.ssh/known_hosts

            # Generate inc/env.local.php from secured repository variables. This file
            # is never committed to git - it's created fresh in the build workspace on
            # every deploy and uploaded to the server in the same pass as the rest of
            # the tree below.
            - |
                php -r '
                $vars = ["DB_PASS","CONSUMER_KEY","CONSUMER_SECRET","GAPI_KEY","GKGSAPI_KEY","AWS_ACCESS_KEY","AWS_SECRET_KEY","RECAPTCHA_SECRET_KEY","SMTP_USER","SMTP_PASS"];
                $lines = ["<?php"];
                foreach ($vars as $v) {
                    $val = getenv($v);
                    if ($val === false || $val === "") {
                        fwrite(STDERR, "Missing required pipeline variable: $v\n");
                        exit(1);
                    }
                    $lines[] = "putenv(" . var_export($v . "=" . $val, true) . ");";
                }
                file_put_contents("inc/env.local.php", implode("\n", $lines) . "\n");
                echo "Generated inc/env.local.php with " . count($vars) . " variables\n";
                '

            # Upload the whole tree over SFTP with plain curl, one file at a time -
            # git-ftp's bundled curl/libssh2 in this image attempts SSH public-key
            # auth first and fails outright instead of falling back to the supplied
            # password; lftp's "-u user,pass" syntax also breaks if the password
            # contains a comma. curl's --user user:pass splits only on the first
            # colon and takes the rest verbatim, so it's safe for any password.
            - |
                REMOTE_ROOT="/home/seatoutlet-beta/htdocs/beta.seatoutlet.com"
                find . -type f -not -path './.git/*' -print0 | \
                  xargs -0 -P 8 -I{} bash -c '
                    f="{}"
                    rel="${f#./}"
                    curl -sS --ftp-create-dirs --user "$0:$1" -T "$f" "sftp://$2:4124/$3/$rel" \
                      || echo "FAILED: $rel"
                  ' "$FTP_USERNAME" "$FTP_PASSWORD" "$FTP_HOST" "$REMOTE_ROOT"
                echo "Upload pass complete"
                FAIL_COUNT=$(find . -type f -not -path './.git/*' -print0 | \
                  xargs -0 -P 8 -I{} bash -c '
                    f="{}"; rel="${f#./}"
                    curl -sS --user "$0:$1" -o /dev/null "sftp://$2:4124/$3/$rel" || echo x
                  ' "$FTP_USERNAME" "$FTP_PASSWORD" "$FTP_HOST" "$REMOTE_ROOT" | wc -l)
                echo "Post-upload verification: $FAIL_COUNT file(s) not confirmed on server"
                if [ "$FAIL_COUNT" -gt 0 ]; then
                  echo "Deploy verification failed - not all files reached the server"
                  exit 1
                fi
